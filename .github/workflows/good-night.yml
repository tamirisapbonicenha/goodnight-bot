name: Boa noite

on:
  schedule:
    # Every 5 minutes. GitHub Actions cron is UTC and can start a few minutes late.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  send-good-night:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Send good night message
        run: npm start
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
